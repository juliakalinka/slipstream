#cloud-config
# Початкове налаштування віртуальної машини демонстраційного стенда.
# Встановлюється лише те, без чого не запрацює docker compose.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw

write_files:
  # Віртуалка має лише 1 ГіБ оперативної пам'яті. Файл підкачки на 2 ГіБ
  # не замінює пам'яті, але рятує від аварійного завершення процесів
  # під час збирання образів і перенавчання моделей.
  - path: /opt/setup-swap.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -e
      [ -f /swapfile ] && exit 0
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
      sysctl -w vm.swappiness=10
      echo 'vm.swappiness=10' > /etc/sysctl.d/99-swappiness.conf

runcmd:
  - [ bash, /opt/setup-swap.sh ]

  # Docker з офіційного репозиторію: у постачанні Ubuntu версія застаріла
  # і не має docker compose як підкоманди.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker azureuser
  - systemctl enable --now docker

  # Другий рубіж після групи безпеки Azure: мережевий екран на самій машині.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Автоматичне встановлення оновлень безпеки: машина працюватиме
  # місяцями без нагляду до самого захисту.
  - apt-get install -y unattended-upgrades
  - dpkg-reconfigure -f noninteractive unattended-upgrades

  - mkdir -p /opt/slipstream
  - chown azureuser:azureuser /opt/slipstream
  - touch /opt/cloud-init-done
