,176.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="650.0" y="167.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">1.1.1: перевірити обліковий запис і роль</tspan></text><polyline points="845.0,204.0 455.0,204.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="650.0" y="195.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">1.1.2: user, role = DevOps</tspan></text><polyline points="445.0,232.0 255.0,232.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="350.0" y="223.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="350.0" dy="0.0">1.2: JWT-токен</tspan></text><polyline points="245.0,260.0 75.0,260.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="160.0" y="251.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">1.3: показати список проєктів</tspan></text><polyline points="75.0,288.0 245.0,288.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="160.0" y="279.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">2: відкрити рекомендації проєкту</tspan></text><polyline points="255.0,316.0 445.0,316.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="350.0" y="307.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="350.0" dy="0.0">2.1: GET /api/v1/projects/{id}/recommendations</tspan></text><polyline points="455.0,344.0 845.0,344.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="650.0" y="335.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">2.1.1: вибрати активні рекомендації</tspan></text><polyline points="845.0,372.0 455.0,372.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="650.0" y="363.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">2.1.2: список</tspan></text><polyline points="245.0,400.0 75.0,400.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="160.0" y="391.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">2.2: рекомендації з очікуваним ефектом (хв, $)</tspan></text><polyline points="75.0,428.0 245.0,428.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="160.0" y="419.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">3: застосувати рекомендацію (карантин flaky-тесту)</tspan></text><polyline points="255.0,456.0 445.0,456.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="350.0" y="447.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="350.0" dy="0.0">3.1: PUT /api/v1/recommendations/{id}/apply</tspan></text><polyline points="455.0,484.0 845.0,484.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="650.0" y="475.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">3.1.1: оновити політику проєкту та статус</tspan></text><polyline points="455.0,512.0 645.0,512.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-open)"/><text x="550.0" y="503.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">3.1.2: перерахувати план для активних гілок</tspan></text><polyline points="245.0,540.0 75.0,540.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="160.0" y="531.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">3.2: сповіщення «Застосовано»</tspan></text><polyline points="75.0,568.0 245.0,568.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="160.0" y="559.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">4: запустити перенавчання моделей</tspan></text><polyline points="255.0,596.0 445.0,596.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="350.0" y="587.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="350.0" dy="0.0">4.1: POST /api/v1/models/retrain</tspan></text><polyline points="455.0,624.0 645.0,624.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="550.0" y="615.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">4.1.1: retrain(projectId, modelType)</tspan></text><polyline points="655.0,652.0 845.0,652.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="750.0" y="643.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="750.0" dy="0.0">4.1.1.1: отримати датасет ознак (вікно 90 днів)</tspan></text><polyline points="845.0,680.0 655.0,680.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="750.0" y="671.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="750.0" dy="0.0">4.1.1.2: дані</tspan></text><polyline points="655.0,708.0 685.0,708.0 685.0,726.0 657.0,726.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="691.0" y="717.0" text-anchor="start" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="691.0" dy="0.0">4.1.2: навчання, крос-валідація</tspan></text><polyline points="655.0,744.0 845.0,744.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="750.0" y="735.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="750.0" dy="0.0">4.1.3: зберегти версію моделі та метрики</tspan></text><polyline points="645.0,772.0 455.0,772.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="550.0" y="763.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">4.2: метрики (ROC-AUC, F1, MAE)</tspan></text><polyline points="245.0,800.0 75.0,800.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="160.0" y="791.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">4.3: звіт про якість нової моделі</tspan></text></svg>