</defs><rect x="0" y="0" width="960" height="860" fill="#FFFFFF"/><g stroke="#1F5B78" stroke-width="1.6" fill="#A8DCF4"><circle cx="70" cy="27" r="7"/><line x1="70" y1="34" x2="70" y2="54"/><line x1="57" y1="41" x2="83" y2="41"/><line x1="70" y1="54" x2="59" y2="70"/><line x1="70" y1="54" x2="81" y2="70"/></g><text x="70.0" y="75.5" text-anchor="middle" font-size="12" fill="#111111" dominant-baseline="middle"><tspan x="70.0" dy="0.0">DevOps-</tspan><tspan x="70.0" dy="15.0">інженер</tspan></text><line x1="70" y1="100" x2="70" y2="840" stroke="#1F5B78" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="199.72" y="40" width="100.55999999999999" height="30" rx="0" fill="#A8DCF4" stroke="#1F5B78" stroke-width="1.2"/><text x="250.0" y="47.5" text-anchor="middle" font-size="12" fill="#111111" dominant-baseline="middle"><tspan x="250.0" dy="0.0">Веб-додаток</tspan><tspan x="250.0" dy="15.0">(SPA)</tspan></text><line x1="250" y1="70" x2="250" y2="840" stroke="#1F5B78" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="399.72" y="40" width="100.55999999999999" height="30" rx="0" fill="#A8DCF4" stroke="#1F5B78" stroke-width="1.2"/><text x="450.0" y="55.0" text-anchor="middle" font-size="12" fill="#111111" dominant-baseline="middle"><tspan x="450.0" dy="0.0">API-шлюз ІС</tspan></text><line x1="450" y1="70" x2="450" y2="840" stroke="#1F5B78" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="585.8" y="40" width="128.39999999999998" height="30" rx="0" fill="#A8DCF4" stroke="#1F5B78" stroke-width="1.2"/><text x="650.0" y="47.5" text-anchor="middle" font-size="12" fill="#111111" dominant-baseline="middle"><tspan x="650.0" dy="0.0">Модуль навчання</tspan><tspan x="650.0" dy="15.0">моделей</tspan></text><line x1="650" y1="70" x2="650" y2="840" stroke="#1F5B78" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="799.72" y="40" width="100.55999999999999" height="30" rx="0" fill="#A8DCF4" stroke="#1F5B78" stroke-width="1.2"/><text x="850.0" y="47.5" text-anchor="middle" font-size="1