services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cicd
      POSTGRES_PASSWORD: cicd
      POSTGRES_DB: cicd
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicd"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://cicd:cicd@db:5432/cicd
      SECRET_KEY: change-me-in-production
      MODELS_DIR: /app/models_store
    ports: ["8000:8000"]
    volumes: ["./models_store:/app/models_store"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
