них</tspan></text><line x1="850" y1="70" x2="850" y2="700" stroke="#1F5B78" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="65.0" y="112" width="10" height="578" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><rect x="245.0" y="120" width="10" height="570" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><rect x="445.0" y="148" width="10" height="512" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><rect x="645.0" y="288" width="10" height="182" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><rect x="845.0" y="178" width="10" height="28" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><rect x="845.0" y="318" width="10" height="30" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><rect x="845.0" y="522" width="10" height="18" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><rect x="845.0" y="610" width="10" height="20" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><rect x="645.0" y="640" width="10" height="22" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1"/><polyline points="75.0,120.0 245.0,120.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="160.0" y="111.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">1: git push (коміт у гілку)</tspan></text><polyline points="255.0,148.0 445.0,148.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="350.0" y="139.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="350.0" dy="0.0">1.1: webhook «pipeline created» (sha, ref, автор)</tspan></text><polyline points="455.0,176.0 845.0,176.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="650.0" y="167.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">1.1.1: зберегти подію та метадані коміту</tspan></text><polyline points="845.0,204.0 455.0,204.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="650.0" y="195.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">1.1.2: OK</tspan></text><polyline points="255.0,232.0 445.0,232.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="350.0" y="223.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="350.0" dy="0.0">2: POST /api/v1/pipelines/plan {sha, ref}  (з job «plan»)</tspan></text><polyline points="455.0,260.0 645.0,260.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="550.0" y="251.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">2.1: buildFeatures(commit, history)</tspan></text><polyline points="655.0,288.0 845.0,288.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="750.0" y="279.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="750.0" dy="0.0">2.1.1: історія збірок, тестів, тривалостей</tspan></text><polyline points="845.0,316.0 655.0,316.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="750.0" y="307.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="750.0" dy="0.0">2.1.2: вибірка даних</tspan></text><polyline points="455.0,344.0 645.0,344.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="550.0" y="335.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">2.2: predictFailure(f), predictDuration(f)</tspan></text><polyline points="645.0,372.0 455.0,372.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="550.0" y="363.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">2.3: p_fail = 0.31, d̂ = 14.2 хв</tspan></text><polyline points="455.0,400.0 645.0,400.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="550.0" y="391.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">2.4: selectTests(changedFiles, budget)</tspan></text><polyline points="645.0,428.0 455.0,428.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="550.0" y="419.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">2.5: перелік тестів + розподіл на шарди</tspan></text><polyline points="455.0,456.0 485.0,456.0 485.0,474.0 457.0,474.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="491.0" y="465.0" text-anchor="start" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="491.0" dy="0.0">2.6: сформувати план (fail-fast, skip, шарди)</tspan></text><polyline points="455.0,492.0 845.0,492.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="650.0" y="483.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">2.7: зберегти прогноз та план</tspan></text><polyline points="445.0,520.0 255.0,520.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="350.0" y="511.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="350.0" dy="0.0">2.8: план конвеєра (dynamic child pipeline YAML)</tspan></text><polyline points="255.0,548.0 285.0,548.0 285.0,566.0 257.0,566.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="291.0" y="557.0" text-anchor="start" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="291.0" dy="0.0">3: виконати оптимізований конвеєр</tspan></text><polyline points="255.0,584.0 445.0,584.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="350.0" y="575.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="350.0" dy="0.0">3.1: webhook «pipeline finished» + JUnit-звіти</tspan></text><polyline points="455.0,612.0 845.0,612.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="650.0" y="603.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="650.0" dy="0.0">3.1.1: зберегти результати job-ів і тестів</tspan></text><polyline points="455.0,640.0 645.0,640.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-open)"/><text x="550.0" y="631.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="550.0" dy="0.0">3.1.2: оновити flaky-оцінки, перевірити аномалії</tspan></text><polyline points="245.0,668.0 75.0,668.0" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-open)"/><text x="160.0" y="659.0" text-anchor="middle" font-size="11" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="160.0" dy="0.0">4: статус конвеєра + посилання на звіт ІС</tspan></text></svg>