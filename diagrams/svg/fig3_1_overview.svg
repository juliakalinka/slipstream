ння:</tspan><tspan x="475.0" dy="13.8">ризик збою · тривалість ·</tspan><tspan x="475.0" dy="13.8">відбір тестів · flaky · аномалії</tspan></text><rect x="130" y="160" width="170" height="56" rx="0" fill="#A8DCF4" stroke="#1F5B78" stroke-width="1.2"/><text x="215.0" y="181.1" text-anchor="middle" font-size="11" fill="#111111" dominant-baseline="middle"><tspan x="215.0" dy="0.0">Модуль планування</tspan><tspan x="215.0" dy="13.8">(fail-fast, skip, шарди)</tspan></text><rect x="380" y="280" width="190" height="66" rx="0" fill="#A8DCF4" stroke="#1F5B78" stroke-width="1.2"/><text x="475.0" y="299.2" text-anchor="middle" font-size="11" fill="#111111" dominant-baseline="middle"><tspan x="475.0" dy="0.0">Веб-дашборд:</tspan><tspan x="475.0" dy="13.8">DORA-метрики, рекомендації,</tspan><tspan x="475.0" dy="13.8">політики, сповіщення</tspan></text><rect x="130" y="290" width="170" height="46" rx="0" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1.2"/><text x="215.0" y="306.1" text-anchor="middle" font-size="11" fill="#111111" dominant-baseline="middle"><tspan x="215.0" dy="0.0">DevOps-інженер,</tspan><tspan x="215.0" dy="13.8">керівник</tspan></text><rect x="630" y="290" width="190" height="46" rx="0" fill="#DDF1FB" stroke="#1F5B78" stroke-width="1.2"/><text x="725.0" y="306.1" text-anchor="middle" font-size="11" fill="#111111" dominant-baseline="middle"><tspan x="725.0" dy="0.0">Slack / Email</tspan><tspan x="725.0" dy="13.8">(сповіщення про аномалії)</tspan></text><polyline points="65.0,71.6 130.0,74.4" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="97.5" y="64.0" text-anchor="middle" font-size="10" fill="#111111" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" dominant-baseline="middle"><tspan x="97.5" dy="0.0">git push</tspan></text><polyline points="300.0,78.0 380.0,78.0" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#m-arrow)"/><text x="340.0" y="69.0" text-anchor="middle" font-siz